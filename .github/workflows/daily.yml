name: LinuxDo Smart Automation v3.1

on:
  workflow_dispatch:
    inputs:
      site_selector:
        description: '选择要运行的站点'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - linux_do
          - idcflare
  schedule:
    - cron: "15 13 * * *"  # UTC时间，北京时间8-23点

env:
  PYTHON_VERSION: '3.11'
  CACHE_PRIMARY_KEY: ${{ github.ref }}-linuxdo-smart-cache-v9

jobs:
  automate-smart:
    runs-on: ubuntu-22.04
    timeout-minutes: 35  # 增加至35分钟，新版本更耗时

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libnss3 \
          libatk-bridge2.0-0 \
          libx11-xcb1 \
          libxcomposite1 \
          libxdamage1 \
          libxrandr2 \
          libgbm1 \
          libxss1 \
          libasound2

    - name: Install Chrome
      run: |
        wget -q -O - https://dl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
        echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list
        sudo apt-get update
        sudo apt-get install -y google-chrome-stable

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install DrissionPage --upgrade

    - name: 恢复智能缓存
      uses: actions/cache@v3
      id: cache-restore
      with:
        path: |
          *.json
          cache/
          sessions/
        key: ${{ env.CACHE_PRIMARY_KEY }}-${{ github.sha }}
        restore-keys: |
          ${{ env.CACHE_PRIMARY_KEY }}-

    - name: Run smart automation for tracking
      env:
        # 凭证配置
        LINUXDO_USERNAME: ${{ secrets.LINUXDO_USERNAME }}
        LINUXDO_CF_COOKIES: ${{ secrets.LINUXDO_CF_COOKIES }}
        LINUXDO_PASSWORD: ${{ secrets.LINUXDO_PASSWORD }}
        IDCFLARE_USERNAME: ${{ secrets.IDCFLARE_USERNAME }}
        IDCFLARE_PASSWORD: ${{ secrets.IDCFLARE_PASSWORD }}
        OCR_API_KEY: ${{ secrets.OCR_API_KEY }}
        
        # 运行配置
        SITE_SELECTOR: ${{ github.event.inputs.site_selector || 'all' }}
        HEADLESS: 'true'
        BROWSE_ENABLED: 'true'
        FORCE_LOGIN: 'false'
        
        # 新脚本环境变量
        TURNSTILE_PATCH_ENABLED: 'true'
        BEHAVIOR_INJECTION_ENABLED: 'true'
        EXTERNAL_LINKS_NEW_TAB: 'true'
        
      run: |
        echo "🎯 开始执行智能自动化脚本 v3.1"
        echo "站点选择: $SITE_SELECTOR"
        echo "缓存恢复: ${{ steps.cache-restore.outputs.cache-hit == 'true' && '✅' || '❌' }}"
        echo "行为注入系统: ✅ (UserScript + 智能模拟)"
        echo "外部链接处理: ✅ (新标签页打开)"
        echo "智能缓存管理: ✅"
        echo "主要目的: 浏览记录收集 ✅"
        python main.py
        echo "✅ 智能脚本执行完成"

    - name: 保存智能缓存
      if: always()
      uses: actions/cache@v3
      with:
        path: |
          *.json
          cache/
          sessions/
        key: ${{ env.CACHE_PRIMARY_KEY }}-${{ github.sha }}

    - name: Upload tracking artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: linuxdo-tracking-data-${{ github.run_id }}
        path: |
          session_data_*.json
          # 失败调试图
          # login_failure_*.png
          # topic_find_failure_*.png
        retention-days: 14
